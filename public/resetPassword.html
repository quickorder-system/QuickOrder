<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - QuickOrder</title>
    <link rel="stylesheet" href="css/authentication.css">
</head>
<body>
    <div class="auth-container">
        <a href="customerLogin.html" class="back-link">Back to login</a>

        <div class="auth-header">
            <h1 id="pageTitle">Reset Password</h1>
            <p id="pageSubtitle">Enter your email to receive a password reset link</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <!-- Forgot Password Form -->
        <form id="forgotPasswordForm" style="display: none;">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <button type="submit" class="btn btn-primary" id="forgotBtn">Send Reset Link</button>

            <div class="form-divider">
                <span>Remember your password?</span>
            </div>

            <div class="form-links">
                <a href="customerLogin.html">Back to login</a>
            </div>
        </form>

        <!-- Reset Password Form -->
        <form id="resetPasswordForm" style="display: none;">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Create a new password" required>
                <div id="passwordStrengthBar" class="password-strength">
                    <div id="passwordStrengthBarFill" class="password-strength-bar"></div>
                </div>
                <div id="passwordStrengthText" class="password-strength-text"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="resetBtn">Reset Password</button>

            <div class="form-divider">
                <span>Password reset link expired?</span>
            </div>

            <div class="form-links">
                <button type="button" class="btn-link" id="backToForgotBtn">Request a new link</button>
            </div>
        </form>

        <!-- Success Message -->
        <div id="successMessage" style="display: none; text-align: center;">
            <h2 style="color: #4CAF50; margin-bottom: 15px;">✓ Password Reset Successful</h2>
            <p style="color: #666; margin-bottom: 20px;">Your password has been updated. You can now login with your new password.</p>
            <a href="customerLogin.html" class="btn btn-primary" style="display: inline-block; text-decoration: none;">Go to Login</a>
        </div>
    </div>

    <script src="js/services/auth.service.js"></script>
    <script src="js/utils/auth-ui.utils.js"></script>
    <script>
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const successMessage = document.getElementById('successMessage');
        const alertMessage = document.getElementById('alertMessage');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const forgotBtn = document.getElementById('forgotBtn');
        const resetBtn = document.getElementById('resetBtn');
        const backToForgotBtn = document.getElementById('backToForgotBtn');
        const emailInput = document.getElementById('email');
        const newPasswordInput = document.getElementById('newPassword');
        const passwordStrengthBar = document.getElementById('passwordStrengthBarFill');
        const passwordStrengthText = document.getElementById('passwordStrengthText');

        let currentMode = 'forgot'; // 'forgot' or 'reset'
        let resetToken = null;

        // Check URL params for mode and token
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        const modeFromUrl = urlParams.get('mode');

        // If token is present in URL, show reset form
        if (tokenFromUrl) {
            resetToken = tokenFromUrl;
            showResetForm();
        } else {
            showForgotForm();
        }

        function showForgotForm() {
            currentMode = 'forgot';
            forgotPasswordForm.style.display = 'block';
            resetPasswordForm.style.display = 'none';
            successMessage.style.display = 'none';
            authUIUtils.clearMessages(alertMessage.parentElement);
        }

        function showResetForm() {
            currentMode = 'reset';
            forgotPasswordForm.style.display = 'none';
            resetPasswordForm.style.display = 'block';
            successMessage.style.display = 'none';
            pageTitle.textContent = 'Create New Password';
            pageSubtitle.textContent = 'Enter your new password';
            authUIUtils.clearMessages(alertMessage.parentElement);
        }

        function showSuccessMessage() {
            forgotPasswordForm.style.display = 'none';
            resetPasswordForm.style.display = 'none';
            successMessage.style.display = 'block';
        }

        // Password strength indicator
        newPasswordInput.addEventListener('input', () => {
            authUIUtils.updatePasswordStrength(
                newPasswordInput,
                passwordStrengthBar,
                passwordStrengthText
            );
        });

        // Forgot password form submission
        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            authUIUtils.clearMessages(alertMessage.parentElement);

            const email = emailInput.value.trim();

            if (!email || !authUIUtils.isValidEmail(email)) {
                authUIUtils.showError('Please enter a valid email address', alertMessage);
                return;
            }

            authUIUtils.disableButton(forgotBtn, 'Sending...');

            try {
                const response = await authService.forgotPassword(email);

                authUIUtils.showSuccess(
                    'Password reset link sent! Check your email for instructions.',
                    alertMessage
                );

                // Clear form
                emailInput.value = '';
                authUIUtils.enableButton(forgotBtn);
            } catch (error) {
                authUIUtils.showError(error.message, alertMessage);
                authUIUtils.enableButton(forgotBtn);
            }
        });

        // Reset password form submission
        resetPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            authUIUtils.clearMessages(alertMessage.parentElement);

            const formData = authUIUtils.getFormData(resetPasswordForm);

            // Validation rules
            const rules = {
                newPassword: {
                    required: true,
                    minLength: 6,
                    minLengthMessage: 'Password must be at least 6 characters'
                },
                confirmPassword: {
                    required: true,
                    matchField: 'newPassword',
                    matchMessage: 'Passwords do not match'
                }
            };

            // Validate form
            const validation = authUIUtils.validateForm(formData, rules);
            if (!validation.isValid) {
                authUIUtils.displayFormErrors(resetPasswordForm, validation.errors);
                authUIUtils.showError('Please fix the errors above', alertMessage);
                return;
            }

            if (!resetToken) {
                authUIUtils.showError('Password reset token is missing', alertMessage);
                return;
            }

            authUIUtils.disableButton(resetBtn, 'Resetting...');

            try {
                const response = await authService.resetPassword(resetToken, formData.newPassword);

                showSuccessMessage();

                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'customerLogin.html';
                }, 3000);
            } catch (error) {
                authUIUtils.showError(error.message, alertMessage);
                authUIUtils.enableButton(resetBtn);

                // If token expired, show back to forgot option
                if (error.message.includes('expired')) {
                    backToForgotBtn.style.display = 'inline';
                }
            }
        });

        // Back to forgot password button
        backToForgotBtn.addEventListener('click', (e) => {
            e.preventDefault();
            resetToken = null;
            showForgotForm();
        });
    </script>
</body>
</html>
